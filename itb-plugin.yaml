apiVersion: itb-plugins/v1
name: hcert-decoder
version: 0.2.0
description: Decodes QR images, HC1 strings, CWT payloads; resolves SHLinks (PIN flow)
homepage: https://github.com/OpenTestBed/itb-plugin-hcert-decoder
license: Apache-2.0
maintainers: [jose.a.teixeira@gmail.com]
runtime:
  compose: compose.plugin.yml
  services:
    # Service/DNS name is hcert-validator (legacy): existing suites' Background
    # declares "HCertDecoder is infrastructure at http://hcert-validator:8080".
    # Rename to hcert-decoder only together with a suite recompile + $DOMAIN{} indirection.
    hcert-validator: { image: "(built from source — see compose.plugin.yml)", port: 8080, healthcheck: /actuator/health }
endpoints:
  hcertDecoder: http://hcert-validator:8080
provides:
  - { capability: hcert-decode, uri: https://opentestbed.github.io/itb-plugins/capabilities/hcert-decode, version: 1.0.0, service: hcert-decoder, entrypoint: /itb/hcert }
requires: []
starterSuite: { path: suite/, specification: plugin-smoke }
# Language extension (dialect): canonical copy; workbench copy is generated
# by itb-cli/src/sync-dialects.mjs.
dialect:
  path: dialect/
  namespace: hcert
